<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal portfolio of Pratik Bisen — IT engineering student and developer building software foundations, web development, and algorithmic problem-solving." />
    <title>Pratik Bisen | Portfolio</title>
    <!-- Prevent theme flash on page load -->
    <script>
      (function() {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const urlTheme = urlParams.get('theme');
          const stored = localStorage.getItem('pb_theme');
          const pref = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          const theme = (urlTheme === 'light' || urlTheme === 'dark')
            ? urlTheme
            : (stored === 'light' || stored === 'dark' ? stored : pref);
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
